<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="VocabFlix">
<meta name="theme-color" content="#E50914">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>VocabFlix</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --red: #E50914; --dark: #0a0a0a; --card: #141414; --card2: #1e1e1e;
  --text: #f0f0f0; --muted: #777; --green: #46d369; --yellow: #f5c518;
  --orange: #ff6b35; --border: #2a2a2a;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

header {
  background: linear-gradient(180deg,#000 0%,transparent 100%);
  padding: 20px 20px 12px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
}
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--red); letter-spacing: 3px; }
.logo span { color: #fff; }

nav {
  display: flex; background: #080808; border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none; position: sticky; top: 64px; z-index: 99;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: 1; min-width: 64px; padding: 12px 4px; background: none; border: none;
  color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500;
  cursor: pointer; transition: color .2s; position: relative; white-space: nowrap;
}
nav button.active { color: #fff; }
nav button.active::after {
  content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
  height: 2px; background: var(--red); border-radius: 2px;
}
.nav-badge {
  display: inline-block; background: var(--red); color: #fff;
  font-size: 9px; border-radius: 10px; padding: 1px 5px; margin-left: 3px; vertical-align: middle;
}

.page { display: none; padding: 16px 16px 100px; }
.page.active { display: block; }

.card { background: var(--card); border-radius: 12px; padding: 18px; margin-bottom: 14px; border: 1px solid var(--border); }
.section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin: 18px 0 10px; }

input[type="text"] {
  background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
  color: #fff; font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 13px 15px;
  outline: none; transition: border-color .2s; width: 100%;
}
input[type="text"]:focus { border-color: var(--red); }
input[type="text"]::placeholder { color: #444; }
.input-row { display: flex; gap: 10px; }
.input-row input { flex: 1; }

.btn { border: none; border-radius: 8px; padding: 13px 18px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
.btn:active { opacity: .7; }
.btn-red { background: var(--red); color: #fff; }
.btn-green { background: var(--green); color: #000; }
.btn-gray { background: var(--card2); color: var(--muted); border: 1px solid var(--border); }
.btn-full { width: 100%; }
.btn-bebas { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.preview-card { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-top: 14px; animation: fadeIn .3s ease; }
.preview-word { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: #fff; letter-spacing: 1px; line-height: 1; }
.preview-pos { font-size: 11px; color: var(--muted); margin-top: 4px; }
.preview-meaning { font-size: 15px; color: var(--yellow); font-weight: 600; margin: 12px 0 8px; line-height: 1.8; white-space: pre-line; }
.preview-example { font-size: 13px; color: #666; font-style: italic; line-height: 1.5; }
.preview-actions { display: flex; gap: 10px; margin-top: 14px; }
.preview-actions .btn { flex: 1; }

.speak-btn {
  background: none; border: 1px solid var(--border); border-radius: 20px;
  color: var(--muted); font-size: 13px; padding: 4px 12px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  transition: all .2s; margin-top: 8px;
}
.speak-btn:active { background: var(--card2); color: #fff; }

.word-item {
  background: var(--card); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 10px; animation: fadeIn .3s ease; border: 1px solid var(--border);
}
.word-item.danger { border-color: #3a1a1a; background: #180a0a; }
.word-main { flex: 1; min-width: 0; }
.word-en { font-size: 17px; font-weight: 600; color: #fff; }
.word-ko { font-size: 13px; color: var(--muted); margin-top: 3px; }
.word-ex { font-size: 11px; color: #444; margin-top: 3px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 10px; padding: 3px 8px; border-radius: 20px; background: var(--card2); color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.badge.wrong { background: #2a0800; color: var(--orange); }
.badge.danger { background: #3a0000; color: #ff4444; }
.del-btn { background: none; border: none; color: #333; font-size: 16px; cursor: pointer; padding: 4px; flex-shrink: 0; }
.del-btn:active { color: var(--red); }

.stats-row { display: flex; gap: 8px; margin-bottom: 16px; }
.stat-box { flex: 1; background: var(--card); border-radius: 10px; padding: 14px 8px; text-align: center; border: 1px solid var(--border); }
.stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 30px; line-height: 1; color: var(--red); }
.stat-label { font-size: 10px; color: var(--muted); margin-top: 3px; }

.quiz-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
.progress-bar { height: 3px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 5px; }
.progress-fill { height: 100%; background: var(--red); border-radius: 3px; transition: width .4s ease; }
.progress-label { font-size: 11px; color: var(--muted); text-align: right; margin-bottom: 20px; }

.quiz-card {
  width: 100%; background: var(--card); border-radius: 16px; padding: 32px 24px;
  text-align: center; margin-bottom: 20px; position: relative; overflow: hidden; border: 1px solid var(--border);
}
.quiz-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--red); }
.quiz-type-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px; }
.quiz-prompt { font-family: 'Bebas Neue', sans-serif; font-size: 52px; color: #fff; letter-spacing: 2px; line-height: 1; }
.quiz-prompt.ko { font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 500; letter-spacing: 0; }
.quiz-pos { font-size: 11px; color: #444; margin-top: 6px; }
.quiz-hint { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

.quiz-input-wrap { width: 100%; margin-bottom: 14px; }
.quiz-input-wrap input { text-align: center; font-size: 17px; }

.quiz-result { width: 100%; border-radius: 12px; padding: 18px; text-align: center; margin-bottom: 14px; animation: fadeIn .3s ease; }
.quiz-result.correct { background: #081a08; border: 1px solid #1a4a1a; }
.quiz-result.wrong { background: #1a0808; border: 1px solid #4a1a1a; }
.result-icon { font-size: 28px; margin-bottom: 6px; }
.result-word { font-size: 20px; font-weight: 700; }
.result-sub { font-size: 13px; color: var(--muted); margin-top: 5px; }

.btn-row { display: flex; gap: 10px; width: 100%; }
.btn-row .btn { flex: 1; }

.no-quiz { text-align: center; padding: 60px 20px; }
.no-quiz .icon { font-size: 52px; margin-bottom: 16px; }
.no-quiz h3 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.no-quiz p { color: var(--muted); font-size: 14px; line-height: 1.7; }

.wrong-header { background: linear-gradient(135deg,#1a0500,#0a0000); border: 1px solid #3a1a00; border-radius: 12px; padding: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
.backup-row { display: flex; gap: 10px; }
.backup-row .btn { flex: 1; font-size: 13px; }

.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #222; color: #fff; padding: 11px 20px; border-radius: 8px;
  font-size: 13px; opacity: 0; transition: all .3s; z-index: 999; white-space: nowrap; pointer-events: none; border: 1px solid var(--border);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.loading-dots::after { content: ''; animation: dots 1.2s infinite; }
@keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>

<header>
  <div class="logo">VOCAB<span>FLiX</span></div>
</header>

<nav>
  <button class="active" id="nav-add" onclick="showPage('add',this)">➕ 추가</button>
  <button id="nav-quiz" onclick="showPage('quiz',this)">🎯 퀴즈</button>
  <button id="nav-words" onclick="showPage('words',this)">📚 단어장</button>
  <button id="nav-wrong" onclick="showPage('wrong',this)">❌ 오답<span class="nav-badge" id="wrong-badge" style="display:none"></span></button>
  <button id="nav-settings" onclick="showPage('settings',this)">⚙️ 설정</button>
</nav>

<!-- ADD -->
<div id="page-add" class="page active">
  <div class="card">
    <div class="section-title" style="margin-top:0">📖 단어 추가</div>
    <input type="text" id="word-input" placeholder="영어 단어 입력 (예: resilient)" autocomplete="off" autocorrect="off" autocapitalize="off" style="margin-bottom:10px" oninput="updateNaverLink()">
    <input type="text" id="manual-meaning" placeholder="한국어 뜻 입력 (예: 회복력 있는)" autocomplete="off" style="margin-bottom:10px">
    <button class="btn btn-full" id="naver-btn" onclick="openNaver()" style="background:#03C75A;color:#fff;font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px">
      <span style="font-size:18px">N</span> 네이버 사전에서 뜻 확인
    </button>
    <button class="btn btn-red btn-bebas btn-full" onclick="manualAdd()">단어장에 추가</button>
  </div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="s-total">0</div><div class="stat-label">저장 단어</div></div>
    <div class="stat-box"><div class="stat-num" id="s-due" style="color:var(--yellow)">0</div><div class="stat-label">오늘 퀴즈</div></div>
    <div class="stat-box"><div class="stat-num" id="s-wrong" style="color:var(--orange)">0</div><div class="stat-label">오답 단어</div></div>
    <div class="stat-box"><div class="stat-num" id="s-done" style="color:var(--green)">0</div><div class="stat-label">완료</div></div>
  </div>
  <div class="section-title">최근 저장 단어</div>
  <div id="recent-list"></div>
</div>

<!-- QUIZ -->
<div id="page-quiz" class="page"><div id="quiz-container"></div></div>

<!-- WORDS -->
<div id="page-words" class="page"><div id="words-container"></div></div>

<!-- WRONG -->
<div id="page-wrong" class="page"><div id="wrong-container"></div></div>

<!-- SETTINGS -->
<div id="page-settings" class="page">
  <div class="card">
    <div class="section-title" style="margin-top:0">🎯 하루 퀴즈 개수 설정</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:16px">한 세션에 풀 총 문제 수예요.</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:8px">
      <button class="btn btn-gray" onclick="adjustCount(-5)" style="padding:10px 18px;font-size:20px;font-weight:700">−5</button>
      <button class="btn btn-gray" onclick="adjustCount(-1)" style="padding:10px 14px;font-size:20px;font-weight:700">−</button>
      <span id="total-quiz-count" style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--red);min-width:60px;text-align:center">20</span>
      <button class="btn btn-gray" onclick="adjustCount(1)" style="padding:10px 14px;font-size:20px;font-weight:700">+</button>
      <button class="btn btn-gray" onclick="adjustCount(5)" style="padding:10px 18px;font-size:20px;font-weight:700">+5</button>
    </div>
    <div style="font-size:12px;color:var(--muted);text-align:center">문제 (최대 80개)</div>
  </div>
  <div class="card">
    <div class="section-title" style="margin-top:0">복습 스케줄</div>
    <div style="font-size:13px;color:var(--muted);line-height:2">
      📖 +1일 — 뜻 보고 단어 맞추기<br>
      ✏️ +2일 — 단어 보고 뜻 맞추기<br>
      📖 +4일 — 뜻 보고 단어 맞추기<br>
      ✏️ +7일 — 단어 보고 뜻 맞추기<br>
      🎯 +14일 — 랜덤 혼합<br><br>
      <span style="color:var(--orange)">❌ 틀릴수록 출제 빈도 증가</span><br>
      <span style="color:#ff4444">⚠️ 5회 이상 틀리면 오답 단어장 등록</span>
    </div>
  </div>
  <div class="card">
    <div class="section-title" style="margin-top:0">💾 데이터 백업</div>
    <div class="backup-row">
      <button class="btn btn-gray" onclick="exportData()">📤 내보내기</button>
      <label class="btn btn-gray" style="cursor:pointer;text-align:center">📥 불러오기<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
    </div>
  </div>
  <div class="card">
    <div class="section-title" style="margin-top:0">위험 구역</div>
    <button class="btn btn-gray btn-full" onclick="resetAll()" style="color:#ff4444;border-color:#3a0000">전체 데이터 초기화</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── IndexedDB ──
const DB_NAME = 'vocabflix_v3', STORE = 'words';
let db = null;
function openDB() {
  return new Promise((res,rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => { const d=e.target.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:'id'}); };
    req.onsuccess = e => { db=e.target.result; res(); };
    req.onerror = rej;
  });
}
const dbGetAll = () => new Promise((res,rej) => { const r=db.transaction(STORE).objectStore(STORE).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=rej; });
const dbPut = w => new Promise((res,rej) => { const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(w); r.onsuccess=res; r.onerror=rej; });
const dbDel = id => new Promise((res,rej) => { const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id); r.onsuccess=res; r.onerror=rej; });
const loadWords = async () => (await dbGetAll()).sort((a,b)=>b.addedAt-a.addedAt);

// ── New Algorithm ──
// 가중치 = (틀린 횟수 + 1) / (노출 횟수 + 1)
// 합산 10번 맞추면 완료
// 영→한/한→영 교차, 중복 없음

const COMPLETE_THRESHOLD = 10;

function getWordWeight(word) {
  const wrong = word.wrongCount || 0;
  const seen = word.seenCount || 0;
  return (wrong + 1) / (seen + 1);
}

function isCompleted(word) {
  return (word.correctCount || 0) >= COMPLETE_THRESHOLD;
}

function getNextType(word) {
  // 마지막으로 나온 타입의 반대로 교차
  const lastType = word.lastQuizType || 'ko_to_en';
  return lastType === 'en_to_ko' ? 'ko_to_en' : 'en_to_ko';
}

async function buildQuizPool() {
  const words = await loadWords();
  const total = getTotalQuizCount();

  // 완료 안된 단어만 필터링
  const candidates = words.filter(w => !isCompleted(w));

  if (!candidates.length) return [];

  // 가중치 계산 후 내림차순 정렬
  const weighted = candidates.map(w => ({
    word: w,
    weight: getWordWeight(w),
    type: getNextType(w)
  })).sort((a, b) => b.weight - a.weight);

  // 상위 N개 선택
  const topN = weighted.slice(0, total);

  // 셔플
  for (let i = topN.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [topN[i], topN[j]] = [topN[j], topN[i]];
  }

  return topN;
}

// ── Naver Dictionary ──
function updateNaverLink() {
  const word = document.getElementById('word-input').value.trim();
  const btn = document.getElementById('naver-btn');
  if (btn) btn.style.opacity = word ? '1' : '0.5';
}
function openNaver() {
  const word = document.getElementById('word-input').value.trim();
  if (!word) { showToast('단어를 먼저 입력해주세요'); return; }
  window.open(`https://en.dict.naver.com/#/search?query=${encodeURIComponent(word)}`, '_blank');
}

// ── Manual Add ──
async function manualAdd() {
  const word = document.getElementById('word-input').value.trim().toLowerCase();
  const meaning = document.getElementById('manual-meaning').value.trim();
  if (!word) { showToast('단어를 입력해주세요'); return; }
  if (!meaning) { showToast('뜻을 입력해주세요'); return; }
  const words = await loadWords();
  if (words.find(w=>w.word===word)) { showToast('이미 저장된 단어예요!'); return; }
  await dbPut({
    id: Date.now(), word, meaning_ko: meaning,
    pos: '', example: '',
    addedAt: Date.now(), completedSteps: [], wrongCount: 0, lastWrongAt: null
  });
  document.getElementById('word-input').value='';
  document.getElementById('manual-meaning').value='';
  showToast(`"${word}" 저장됐어요 ✓`);
  await refreshAll();
}

// ── Quiz Count Setting ──
function getTotalQuizCount() {
  return parseInt(localStorage.getItem('vf_total_count') || '20');
}
function adjustCount(delta) {
  const current = getTotalQuizCount();
  const next = Math.min(80, Math.max(1, current + delta));
  localStorage.setItem('vf_total_count', next);
  const el = document.getElementById('total-quiz-count');
  if (el) el.textContent = next;
  localStorage.removeItem('vf_quiz_pool');
  localStorage.removeItem('vf_quiz_pool_date');
  showToast(`하루 ${next}문제로 설정됐어요`);
}
function loadCountSettings() {
  const el = document.getElementById('total-quiz-count');
  if (el) el.textContent = getTotalQuizCount();
}
function speak(word, btn) {
  if (!('speechSynthesis' in window)) { showToast('발음 기능을 지원하지 않아요'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang='en-US'; u.rate=0.9;
  if (btn) {
    btn.textContent='🔊 재생 중...';
    u.onend = () => btn.textContent='🔊 발음 듣기';
    u.onerror = () => btn.textContent='🔊 발음 듣기';
  }
  window.speechSynthesis.speak(u);
}

// ── Stats ──
async function updateStats() {
  const words = await loadWords();
  const candidates = words.filter(w => !isCompleted(w));
  const total = getTotalQuizCount();
  const actualQuiz = Math.min(candidates.length, total);
  const wrongWords = words.filter(w=>(w.wrongCount||0)>=5);
  const done = words.filter(w=>isCompleted(w));
  document.getElementById('s-total').textContent=words.length;
  document.getElementById('s-due').textContent=actualQuiz;
  document.getElementById('s-wrong').textContent=wrongWords.length;
  document.getElementById('s-done').textContent=done.length;
  const wb=document.getElementById('wrong-badge');
  wb.textContent=wrongWords.length; wb.style.display=wrongWords.length?'inline-block':'none';
}

async function renderRecent() {
  const words=(await loadWords()).slice(0,5);
  const el=document.getElementById('recent-list');
  if (!words.length) { el.innerHTML='<div class="empty">아직 저장된 단어가 없어요<br>첫 단어를 추가해보세요!</div>'; return; }
  el.innerHTML=words.map(w=>`
    <div class="word-item">
      <div class="word-main"><div class="word-en">${w.word}</div><div class="word-ko">${w.meaning_ko.split('\n')[0]}</div></div>
      ${(w.wrongCount||0)>0?`<span class="badge wrong">오답 ${w.wrongCount}회</span>`:''}
      <span class="badge">${new Date(w.addedAt).toLocaleDateString('ko')}</span>
    </div>`).join('');
}

// ── Quiz ──
let quizPool=[], quizIndex=0, quizAnswered=false;

async function buildQuizPool() {
  const now = new Date();
  const todayStr = now.toDateString();
  const todayNoonStr = `${todayStr}_noon`;
  if (localStorage.getItem('vf_quiz_done')===todayStr) return [];
  if (now.getHours()<12) return null;
  const cached=localStorage.getItem('vf_quiz_pool');
  const cachedDate=localStorage.getItem('vf_quiz_pool_date');
  if (cached && cachedDate===todayNoonStr) return JSON.parse(cached);

  const due = await getDueItems();
  const {en: enMax, ko: koMax} = getQuizCount();
  const seenE=new Set(), seenK=new Set(), enToKo=[], koToEn=[];
  for (const d of due) {
    if (d.type==='en_to_ko' && !seenE.has(d.word.id)) { seenE.add(d.word.id); enToKo.push(d); if(enToKo.length>=enMax) break; }
  }
  for (const d of due) {
    if (d.type==='ko_to_en' && !seenK.has(d.word.id)) { seenK.add(d.word.id); koToEn.push(d); if(koToEn.length>=koMax) break; }
  }
  const pool=[];
  const max=Math.max(enToKo.length,koToEn.length);
  for (let i=0;i<max;i++) {
    if (i<enToKo.length) pool.push(enToKo[i]);
    if (i<koToEn.length) pool.push(koToEn[i]);
  }
  localStorage.setItem('vf_quiz_pool',JSON.stringify(pool));
  localStorage.setItem('vf_quiz_pool_date',todayNoonStr);
  return pool;
}

async function renderQuiz() {
  const container=document.getElementById('quiz-container');
  if (quizIndex===0) quizPool=await buildQuizPool();

  if (!quizPool||!quizPool.length) {
    container.innerHTML=`<div class="no-quiz"><div class="icon">🎬</div><h3>퀴즈 없음!</h3><p>저장된 단어가 없거나 모두 완료됐어요.<br>단어를 추가해보세요!</p></div>`; return;
  }
  if (quizIndex>=quizPool.length) {
    container.innerHTML=`<div class="no-quiz"><div class="icon">🏆</div><h3>오늘 복습 완료!</h3><p>총 ${quizPool.length}문제를 풀었어요!</p><button class="btn btn-red btn-full" style="margin-top:20px" onclick="quizIndex=0;renderQuiz()">다시 풀기</button></div>`; return;
  }

  const item=quizPool[quizIndex];
  const w=item.word, type=item.type;
  quizAnswered=false;
  const pct=Math.round((quizIndex/quizPool.length)*100);

  container.innerHTML=`
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${quizIndex+1} / ${quizPool.length}</div>
    <div class="quiz-wrap">
      <div class="quiz-card">
        <div class="quiz-type-label">${type==='en_to_ko'?'🇺🇸 단어 → 🇰🇷 뜻':'🇰🇷 뜻 → 🇺🇸 단어'}</div>
        <div class="quiz-prompt ${type==='ko_to_en'?'ko':''}">${type==='en_to_ko'?w.word:w.meaning_ko.split('\n')[0]}</div>
        ${type==='en_to_ko'?`<button class="speak-btn" id="quiz-speak-btn" onclick="speak('${w.word}',this)" style="margin:8px auto 0;display:flex">🔊 발음 듣기</button>`:''}
        ${(w.wrongCount||0)>=3?`<div class="quiz-hint">⚠️ 자주 틀리는 단어예요</div>`:''}
      </div>
      <div class="quiz-input-wrap">
        <input type="text" id="quiz-ans" placeholder="${type==='en_to_ko'?'한국어 뜻 입력...':'영어 단어 입력...'}" onkeydown="if(event.key==='Enter')checkAnswer()" autocomplete="off" autocorrect="off" autocapitalize="off">
      </div>
      <div id="result-area"></div>
      <div class="btn-row" id="quiz-btns">
        <button class="btn btn-gray btn-bebas" onclick="skipQuiz()">모르겠어요</button>
        <button class="btn btn-red btn-bebas" onclick="checkAnswer()">확인</button>
      </div>
    </div>`;
  setTimeout(()=>{
    const i=document.getElementById('quiz-ans'); if(i) i.focus();
    // 영→한 퀴즈면 발음 자동 재생
    if (type==='en_to_ko') speak(w.word, document.getElementById('quiz-speak-btn'));
  },100);
}

async function checkAnswer() {
  if (quizAnswered) return;
  const item=quizPool[quizIndex];
  const w=item.word, type=item.type;
  const ansEl=document.getElementById('quiz-ans');
  const userAns=(ansEl?.value||'').trim();
  if (!userAns) return;
  quizAnswered=true;
  if (ansEl) ansEl.disabled=true;
  const correctRaw=type==='en_to_ko'?w.meaning_ko:w.word;
  document.getElementById('result-area').innerHTML=`
    <div class="quiz-result" style="background:var(--card2);border:1px solid var(--border)">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">정답</div>
      <div class="result-word">${correctRaw.split('\n')[0]}</div>
      ${type==='ko_to_en'?`<button class="speak-btn" onclick="speak('${w.word}',this)" style="margin:8px auto 0;display:flex">🔊 발음 듣기</button>`:''}
      ${w.example?`<div class="result-sub" style="font-style:italic;margin-top:8px">"${w.example}"</div>`:''}
      <div style="margin-top:8px;font-size:13px;color:var(--muted)">내 답: <span style="color:#fff">${userAns}</span></div>
    </div>`;
  document.getElementById('quiz-btns').innerHTML=`
    <button class="btn btn-bebas" style="flex:1;background:#1a0808;color:#ff6666;border:1px solid #4a1a1a;font-size:18px" onclick="gradeAnswer(false)">❌ 틀렸어요</button>
    <button class="btn btn-bebas" style="flex:1;background:#081a08;color:var(--green);border:1px solid #1a4a1a;font-size:18px" onclick="gradeAnswer(true)">✅ 맞았어요</button>`;
}

async function gradeAnswer(isCorrect) {
  const item=quizPool[quizIndex];
  const w=item.word, correctRaw=item.type==='en_to_ko'?w.meaning_ko:w.word;

  const words=await loadWords();
  const word=words.find(x=>x.id===w.id);
  if (word) {
    word.seenCount=(word.seenCount||0)+1;
    word.lastQuizType=item.type;
    if (isCorrect) {
      word.correctCount=(word.correctCount||0)+1;
      if (word.correctCount>=COMPLETE_THRESHOLD) showToast('🎓 완료! 이 단어는 졸업했어요');
      else showToast('정답! 🎉');
    } else {
      word.wrongCount=(word.wrongCount||0)+1;
      word.lastWrongAt=Date.now();
      if (word.wrongCount===5) showToast('⚠️ 오답 단어장에 등록됐어요');
      else showToast('오답 처리됐어요');
    }
    await dbPut(word);
  }

  if (isCorrect) {
    document.getElementById('result-area').innerHTML=`
      <div class="quiz-result correct">
        <div class="result-icon">✅</div>
        <div class="result-word">${correctRaw.split('\n')[0]}</div>
        ${item.type==='ko_to_en'?`<button class="speak-btn" id="result-speak-btn" onclick="speak('${w.word}',this)" style="margin:8px auto 0;display:flex">🔊 발음 듣기</button>`:''}
        ${w.example?`<div class="result-sub" style="font-style:italic">"${w.example}"</div>`:''}
      </div>`;
    if (item.type==='ko_to_en') setTimeout(()=>speak(w.word, document.getElementById('result-speak-btn')),100);
    document.getElementById('quiz-btns').innerHTML='';
    setTimeout(()=>{ quizIndex++; renderQuiz(); }, 1500);
  } else {
    document.getElementById('result-area').innerHTML=`
      <div class="quiz-result wrong">
        <div class="result-icon">❌</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px">정답:</div>
        <div class="result-word">${correctRaw.split('\n')[0]}</div>
        ${item.type==='ko_to_en'?`<button class="speak-btn" id="result-speak-btn" onclick="speak('${w.word}',this)" style="margin:8px auto 0;display:flex">🔊 발음 듣기</button>`:''}
      </div>`;
    if (item.type==='ko_to_en') setTimeout(()=>speak(w.word, document.getElementById('result-speak-btn')),100);
    document.getElementById('quiz-btns').innerHTML=`<button class="btn btn-red btn-bebas btn-full" onclick="quizIndex++;renderQuiz()">다음 →</button>`;
  }
  await updateStats();
}

async function skipQuiz() {
  if (quizAnswered) return;
  const item=quizPool[quizIndex];
  const w=item.word, correctRaw=item.type==='en_to_ko'?w.meaning_ko:w.word;
  quizAnswered=true;
  const ansEl=document.getElementById('quiz-ans');
  if (ansEl) ansEl.disabled=true;

  const words=await loadWords();
  const word=words.find(x=>x.id===w.id);
  if (word) {
    word.seenCount=(word.seenCount||0)+1;
    word.lastQuizType=item.type;
    word.wrongCount=(word.wrongCount||0)+1;
    word.lastWrongAt=Date.now();
    await dbPut(word);
    if (word.wrongCount===5) showToast('⚠️ 오답 단어장에 등록됐어요');
    else showToast('오답 처리됐어요');
  }

  document.getElementById('result-area').innerHTML=`
    <div class="quiz-result wrong">
      <div class="result-icon">❌</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">정답:</div>
      <div class="result-word">${correctRaw.split('\n')[0]}</div>
      ${item.type==='ko_to_en'?`<button class="speak-btn" id="result-speak-btn" onclick="speak('${w.word}',this)" style="margin:8px auto 0;display:flex">🔊 발음 듣기</button>`:''}
    </div>`;
  if (item.type==='ko_to_en') setTimeout(()=>speak(w.word, document.getElementById('result-speak-btn')),100);
  document.getElementById('quiz-btns').innerHTML=`<button class="btn btn-red btn-bebas btn-full" onclick="quizIndex++;renderQuiz()">다음 →</button>`;
  await updateStats();
}

// ── Word List ──
async function renderWords() {
  const words=await loadWords();
  const container=document.getElementById('words-container');
  if (!words.length) { container.innerHTML='<div class="empty">저장된 단어가 없어요</div>'; return; }
  container.innerHTML=`<div class="section-title">${words.length}개 단어</div>`+
    words.map(w=>{
      const wc=w.wrongCount||0, isDanger=wc>=5;
      const completed=isCompleted(w);
      const correct=w.correctCount||0;
      const badge=completed
        ?'<span class="badge" style="color:var(--green);background:#081a08">완료 ✓</span>'
        :correct>0?`<span class="badge" style="color:var(--yellow);background:#1a1400">✓${correct}/10</span>`
        :'<span class="badge">미시작</span>';
      return `<div class="word-item ${isDanger?'danger':''}">
        <div class="word-main">
          <div class="word-en">${w.word}${isDanger?' ⚠️':''}</div>
          <div class="word-ko">${w.meaning_ko.split('\n')[0]}</div>
          ${w.example?`<div class="word-ex">${w.example}</div>`:''}
        </div>
        ${wc>0?`<span class="badge ${isDanger?'danger':'wrong'}">${isDanger?'오답5+':'오답'+wc}</span>`:''}
        ${badge}
        <button class="del-btn" onclick="deleteWord(${w.id})">✕</button>
      </div>`;
    }).join('');
}

async function deleteWord(id) {
  if (!confirm('단어를 삭제할까요?')) return;
  await dbDel(id); await renderWords(); await refreshAll(); showToast('삭제됐어요');
}

// ── Wrong Words ──
async function renderWrong() {
  const words=await loadWords();
  const wrong=words.filter(w=>(w.wrongCount||0)>=5).sort((a,b)=>(b.wrongCount||0)-(a.wrongCount||0));
  const container=document.getElementById('wrong-container');
  container.innerHTML=`<div class="wrong-header"><div style="font-size:32px">❌</div><div><h3 style="font-size:15px;font-weight:600">오답 단어장</h3><p style="font-size:12px;color:var(--muted)">5회 이상 틀린 단어 ${wrong.length}개</p></div></div>`;
  if (!wrong.length) { container.innerHTML+='<div class="empty">오답 단어가 없어요!<br>계속 잘 하고 있어요 🎉</div>'; return; }
  container.innerHTML+=wrong.map(w=>`
    <div class="word-item danger">
      <div class="word-main"><div class="word-en">${w.word}</div><div class="word-ko">${w.meaning_ko.split('\n')[0]}</div></div>
      <span class="badge danger">오답 ${w.wrongCount}회</span>
      <button class="del-btn" onclick="deleteWord(${w.id})">✕</button>
    </div>`).join('');
}

// ── Backup ──
async function exportData() {
  const words=await loadWords();
  if (!words.length) { showToast('저장된 단어가 없어요'); return; }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({version:3,words},null,2)],{type:'application/json'}));
  a.download=`vocabflix_${new Date().toLocaleDateString('ko').replace(/\./g,'-').trim()}.json`;
  a.click(); showToast(`${words.length}개 단어 내보내기 완료!`);
}
async function importData(e) {
  const file=e.target.files[0]; if(!file) return;
  try {
    const data=JSON.parse(await file.text());
    const words=data.words||data; let added=0;
    for (const w of words) { if(w.id&&w.word) { await dbPut(w); added++; } }
    await refreshAll(); showToast(`${added}개 단어 불러오기 완료!`);
  } catch { showToast('파일 형식이 올바르지 않아요'); }
  e.target.value='';
}
async function resetAll() {
  if (!confirm('정말 모든 데이터를 삭제할까요?')) return;
  const words=await loadWords();
  for (const w of words) await dbDel(w.id);
  await refreshAll(); showToast('초기화됐어요');
}

// ── Nav ──
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(`page-${name}`).classList.add('active');
  if (btn) btn.classList.add('active');
  if (name==='quiz') renderQuiz(); // quizIndex 초기화 안 함
  if (name==='words') renderWords();
  if (name==='wrong') renderWrong();
  if (name==='settings') loadCountSettings();
  updateStats();
}

// ── Toast ──
let toastTimer;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── Refresh & Init ──
async function refreshAll() { await updateStats(); await renderRecent(); }
async function init() { await openDB(); await refreshAll(); }
init();
</script>
